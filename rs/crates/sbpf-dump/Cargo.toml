[package]
name = "sbpf-dump"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
sbpf-elf.workspace = true
sbpf-ir.workspace = true
sbpf-program.workspace = true
sbpf-dataflow.workspace = true
sbpf-opt.workspace = true
sbpf-struct.workspace = true
sbpf-print.workspace = true
sbpf-read.workspace = true
sbpf-lib.workspace = true
sbpf-cli.workspace = true
pprof = { version = "0.15", optional = true, default-features = false }

[features]
# `--prof out.folded <cli args>`: sampling profile (SIGPROF) of a CLI run, folded stacks (dev tool)
prof = ["dep:pprof"]
