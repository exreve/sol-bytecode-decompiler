name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BIN: ${{ github.workspace }}/target/release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Unit tests
        run: cargo test --release
      - name: Equivalence (tracked samples)
        # (exits non-zero on a failing function or an error)
        run: |
          for s in memo token ata; do
            $BIN/sbpf-equiv samples/$s.so 2
          done
      - name: Regression (sBPF v3, 2.7 MB Anchor program; crashed on v3 syscall calls)
        run: |
          $BIN/sbpf-decompile samples/svault_v3.so -o out/svault/
          $BIN/sbpf-equiv samples/svault_v3.so 1
      - name: Compatibility set (C, Zig, asm, Solang, BPFLoader1, sBPF v2/v3, other SVM chains; compat/README.md)
        run: $BIN/sbpf-compat
      - name: Regression (IDL mode; crashed with a Views.resolve cycle)
        run: |
          for p in squads_v4 metadao_conditional_vault; do
            $BIN/sbpf-decompile samples/regress/$p.so --idl samples/regress/$p.json -o out/$p/
            $BIN/sbpf-equiv samples/regress/$p.so 1 --idl samples/regress/$p.json
          done
      - name: Analysis benchmark (minimum score 85)
        run: |
          $BIN/sbpf-bench | tee bench.log
          score=$(grep -oP '^score \K[0-9.]+' bench.log)
          echo "score $score"
          awk -v s="$score" 'BEGIN { exit !(s >= 85) }'
