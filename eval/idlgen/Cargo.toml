[package]
name = "idlgen"
version = "0.1.0"
edition = "2021"

# Anchor IDL from program source (what `anchor idl parse` does in anchor 0.29), used by eval/build.sh for the Anchor cases
[dependencies]
anchor-syn = { version = "=0.29.0", features = ["idl-parse", "event-cpi", "init-if-needed"] }
serde_json = "1"

