[package]
name = "o_record"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
v_write_no_signer = []
v_set_authority_no_signer = []
v_close_no_key = []
no-entrypoint = []

[lints.rust]
unexpected_cfgs = { level = "allow" }

[dependencies]
bytemuck = { version = "1.19.0", features = ["derive"] }
num-derive = "0.4"
num-traits = "0.2"
solana-account-info = "2.1.0"
solana-decode-error = "2.1.0"
solana-instruction = { version = "2.1.0", features = ["std"] }
solana-msg = "2.1.0"
solana-program-entrypoint = "2.1.0"
solana-program-error = "2.1.0"
solana-program-pack = "2.1.0"
solana-pubkey = { version = "2.1.0", features = ["bytemuck"] }
solana-rent = "2.1.0"
thiserror = "1.0"
